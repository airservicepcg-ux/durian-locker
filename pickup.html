<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>DURIAN PICKUP</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px;
}

.card{
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h2{
    margin-top:0;
}

button{
    width:100%;
    padding:16px;
    margin:8px 0;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.platformBtn{
    background:#009688;
    color:white;
}

.orderBtn{
    background:#2196F3;
    color:white;
}

.choiceBtn{
    background:#FF9800;
    color:white;
}

.confirmBtn{
    background:#4CAF50;
    color:white;
}

.hidden{
    display:none;
}

.locker{
    display:inline-block;
    min-width:70px;
    padding:20px;
    margin:5px;
    background:#4CAF50;
    color:white;
    font-size:24px;
    border-radius:10px;
    text-align:center;
}

.center{
    text-align:center;
}

.error{
    color:red;
    font-size:20px;
}

.success{
    color:green;
    font-size:20px;
}

</style>
</head>

<body>

<div class="container">

<!-- STEP 1 -->

<div id="step1" class="card">

<h2>🍈 DURIAN PICKUP</h2>

<p>เลือก Platform</p>

<button
class="platformBtn"
onclick="loadOrders('LINEMAN')">
LINE MAN
</button>

<button
class="platformBtn"
onclick="loadOrders('GRAB')">
GRAB
</button>

<button
class="platformBtn"
onclick="loadOrders('SHOPEE')">
SHOPEE
</button>

</div>

<!-- STEP 2 -->

<div id="step2"
class="card hidden">

<h2>เลือกออเดอร์</h2>

<div id="orderList"></div>

</div>

<!-- STEP 3 -->

<div id="step3"
class="card hidden">

<h2>ยืนยันตัวตน</h2>

<p>
Order :
<span id="showOrderNo"></span>
</p>

<div id="nameList"></div>

</div>

<!-- STEP 4 -->

<div id="step4"
class="card hidden">

<h2>เลือก 4 ตัวท้ายเบอร์โทร</h2>

<div id="phoneList"></div>

</div>

<!-- STEP 5 -->

<div id="step5"
class="card hidden center">

<h2>รับสินค้า</h2>

<div id="lockerDisplay"></div>

<br>

<button
class="confirmBtn"
onclick="confirmPickup()">

รับสินค้า

</button>

</div>

<!-- SUCCESS -->

<div id="successPage"
class="card hidden">

<h2 class="success">
✅ รับสินค้าเรียบร้อย
</h2>

<div id="successText"></div>

</div>

<!-- ERROR -->

<div id="errorPage"
class="card hidden">

<h2 class="error">
❌ ข้อมูลไม่ถูกต้อง
</h2>

<p>

รายการถูกระงับแล้ว

</p>

<p>

กรุณาติดต่อ

<br><br>

<b>082-756-3568</b>

</p>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyK1YPdLDcjmUUXnWjUo_sCX0s2ZUR3WiExYplrH54RYrwdEL0RnjjebTovq9S8b2546w/exec";

let currentOrder = null;

let selectedName = "";

function showStep(id){

document
.querySelectorAll(".card")
.forEach(x=>x.classList.add("hidden"));

document
.getElementById(id)
.classList.remove("hidden");

}

function shuffle(arr){

return arr.sort(
()=>Math.random()-0.5
);

}

/* =========================
LOAD ORDERS
========================= */

async function loadOrders(platform){

const res =
await fetch(
API_URL +
"?action=getOrders&platform=" +
platform
);

const orders =
await res.json();

let html = "";

orders.forEach(order=>{

html += `
<button
class="orderBtn"
onclick="selectOrder('${order.orderNo}')">

${order.orderNo}
<br>
${order.customer}

</button>
`;

});

document
.getElementById("orderList")
.innerHTML = html;

showStep("step2");

}

/* =========================
SELECT ORDER
========================= */

async function selectOrder(orderNo){

const res =
await fetch(
API_URL +
"?action=getOrder&orderNo=" +
orderNo
);

currentOrder =
await res.json();

document
.getElementById("showOrderNo")
.innerText =
currentOrder.orderNo;

const realName =
currentOrder.riderName;

const names = shuffle([

realName,
"สมชาย ใจดี",
"ธนพล บุญมี",
"วิชัย ทองสุข"

]);

let html = "";

names.forEach(name=>{

html += `
<button
class="choiceBtn"
onclick="selectName('${name}')">

${name}

</button>
`;

});

document
.getElementById("nameList")
.innerHTML =
html;

showStep("step3");

}

/* =========================
NAME
========================= */

function selectName(name){

if(
name !== currentOrder.riderName
){

failPickup();
return;

}

selectedName = name;

const realPhone =
String(
currentOrder.riderPhone
).slice(-4);

const phones = shuffle([

realPhone,
"1234",
"5678",
"9999"

]);

let html = "";

phones.forEach(phone=>{

html += `
<button
class="choiceBtn"
onclick="selectPhone('${phone}')">

${phone}

</button>
`;

});

document
.getElementById("phoneList")
.innerHTML =
html;

showStep("step4");

}

/* =========================
PHONE
========================= */

function selectPhone(phone){

const realPhone =
String(
currentOrder.riderPhone
).slice(-4);

if(phone !== realPhone){

failPickup();
return;

}

showLocker();

}

/* =========================
LOCKER
========================= */

function showLocker(){

let html = "";

const lockers =
String(
currentOrder.locker
).split(",");

lockers.forEach(locker=>{

html += `
<div class="locker">

${locker}

</div>
`;

});

document
.getElementById("lockerDisplay")
.innerHTML =
html;

showStep("step5");

}

/* =========================
CONFIRM
========================= */

async function confirmPickup(){

const res =
await fetch(

API_URL +

"?action=confirmPickup" +

"&orderNo=" +
currentOrder.orderNo +

"&riderName=" +
encodeURIComponent(
currentOrder.riderName
)

);

const data =
await res.json();

document
.getElementById("successText")
.innerHTML =

`
Order :
${currentOrder.orderNo}

<br><br>

Locker :
${data.locker}

<br><br>

รับสินค้าเรียบร้อย
`;

showStep("successPage");

}

/* =========================
FAIL
========================= */

async function failPickup(){

await fetch(

API_URL +

"?action=failPickup" +

"&orderNo=" +

currentOrder.orderNo

);

showStep("errorPage");

}

</script>

</body>
</html>
