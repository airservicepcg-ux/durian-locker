```html
<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Durian Locker - Admin</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

h2{
    text-align:center;
}

.section{
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:250px;
    padding:10px;
    box-sizing:border-box;
}

input[type=text]{
    width:100%;
    padding:10px;
    box-sizing:border-box;
}

.locker-group label{
    margin-right:15px;
}

button{
    background:#28a745;
    color:white;
    border:none;
    padding:12px 20px;
    cursor:pointer;
    font-size:16px;
    border-radius:5px;
}

button:disabled{
    background:#999;
    cursor:not-allowed;
}

#status{
    margin-top:15px;
    font-weight:bold;
}

</style>

</head>

<body>

<h2>Durian Locker Admin</h2>

<div class="section">

<h3>Platform</h3>

<label>
<input type="radio" name="platform" value="LINEMAN" checked>
LINE MAN
</label>

<label>
<input type="radio" name="platform" value="GRAB">
GRAB
</label>

<label>
<input type="radio" name="platform" value="SHOPEE">
SHOPEE FOOD
</label>

</div>

<div class="section">

<h3>Order Text</h3>

<textarea
id="orderText"
placeholder="Paste Order Text Here">
</textarea>

</div>

<div class="section">

<h3>Rider Phone</h3>

<input
type="text"
id="riderPhone"
placeholder="0812345678">

</div>

<div class="section">

<h3>Locker</h3>

<div class="locker-group">

<label><input type="checkbox" value="1"> Locker 1</label>
<label><input type="checkbox" value="2"> Locker 2</label>
<label><input type="checkbox" value="3"> Locker 3</label>
<label><input type="checkbox" value="4"> Locker 4</label>
<label><input type="checkbox" value="5"> Locker 5</label>

</div>

</div>

<button id="saveBtn" onclick="saveData()">
Save Order
</button>

<div id="status"></div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyK1YPdLDcjmUUXnWjUo_sCX0s2ZUR3WiExYplrH54RYrwdEL0RnjjebTovq9S8b2546w/exec";

async function saveData(){

    const btn =
    document.getElementById("saveBtn");

    btn.disabled = true;
    btn.innerText = "Saving...";

    const platform =
    document.querySelector(
    'input[name="platform"]:checked'
    ).value;

    const riderPhone =
    document.getElementById(
    "riderPhone"
    ).value.trim();

    const orderText =
    document.getElementById(
    "orderText"
    ).value.trim();

    const lockers =
    [...document.querySelectorAll(
    '.locker-group input[type="checkbox"]:checked'
    )].map(cb => cb.value);

    if(orderText === ""){

        alert("กรุณาวางข้อความออเดอร์");

        btn.disabled = false;
        btn.innerText = "Save Order";

        return;
    }

    const payload = {
        platform,
        riderPhone,
        lockers,
        orderText
    };

    try{

        const response = await fetch(
        API_URL,
        {
            method:"POST",
            body:JSON.stringify(payload)
        });

        const result =
        await response.json();

        if(result.status === "success"){

            document.getElementById(
            "status"
            ).innerHTML =
            "✅ บันทึกสำเร็จ";

            resetForm();

        }else{

            document.getElementById(
            "status"
            ).innerHTML =
            "❌ เกิดข้อผิดพลาด";

        }

    }catch(err){

        document.getElementById(
        "status"
        ).innerHTML =
        "❌ ไม่สามารถเชื่อมต่อระบบได้";

        console.error(err);

    }

    btn.disabled = false;
    btn.innerText = "Save Order";

}

function resetForm(){

    document.getElementById(
    "orderText"
    ).value = "";

    document.getElementById(
    "riderPhone"
    ).value = "";

    document.querySelectorAll(
    '.locker-group input[type="checkbox"]'
    ).forEach(cb => cb.checked = false);

    document.querySelector(
    'input[value="LINEMAN"]'
    ).checked = true;

    document.getElementById(
    "orderText"
    ).focus();

}

</script>

</body>
</html>
```
