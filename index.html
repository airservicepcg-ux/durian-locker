<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Delivery Order Intake</title>

<style>

body{
  font-family: Arial;
  max-width:700px;
  margin:auto;
  padding:20px;
}

textarea{
  width:100%;
  height:250px;
}

button{
  padding:10px;
  margin:5px;
}

</style>

</head>

<body>

<h2>Delivery Order Intake</h2>

<h3>Platform</h3>

<label>
<input type="radio"
name="platform"
value="LINEMAN"
checked>
LINE MAN
</label>

<label>
<input type="radio"
name="platform"
value="GRAB">
GRAB
</label>

<label>
<input type="radio"
name="platform"
value="SHOPEE">
SHOPEE FOOD
</label>

<hr>

<h3>Order Text</h3>

<textarea id="orderText"></textarea>

<hr>

<h3>Rider Phone</h3>

<input
type="text"
id="riderPhone"
style="width:100%;padding:10px;">

<hr>

<h3>Locker</h3>

<label><input type="checkbox" value="1">1</label>
<label><input type="checkbox" value="2">2</label>
<label><input type="checkbox" value="3">3</label>
<label><input type="checkbox" value="4">4</label>
<label><input type="checkbox" value="5">5</label>

<br><br>

<button onclick="saveData()">
Save Order
</button>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyK1YPdLDcjmUUXnWjUo_sCX0s2ZUR3WiExYplrH54RYrwdEL0RnjjebTovq9S8b2546w/exec";

async function saveData(){

  const platform =
  document.querySelector(
    'input[name="platform"]:checked'
  ).value;

  const riderPhone =
  document.getElementById(
    "riderPhone"
  ).value;

  const orderText =
  document.getElementById(
    "orderText"
  ).value;

  const lockers =
  [...document.querySelectorAll(
    'input[type="checkbox"]:checked'
  )].map(cb=>cb.value);

  const payload = {
    platform,
    riderPhone,
    lockers,
    orderText
  };

  const res = await fetch(
    API_URL,
    {
      method:"POST",
      body:JSON.stringify(payload)
    }
  );

  const result = await res.json();

  alert(result.status);

}

</script>

</body>
</html>
